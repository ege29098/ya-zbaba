<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Fortnite?</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 30px;
        }

        #buttons {
            position: relative;
            width: 400px;
            height: 200px;
        }

        button {
            font-size: 20px;
            padding: 15px 30px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            position: absolute;
        }

        #yes {
            background-color: #2ecc71;
            left: 50px;
            top: 80px;
            transition: all 0.2s ease;
        }

        #no {
            background-color: #e74c3c;
            right: 50px;
            top: 80px;
        }
    </style>
</head>
<body>
    <h1>Yağız Ders Çalışacak mı??</h1>
    <div id="buttons">
        <button id="yes">Evet</button>
        <button id="no">Hayır</button>
    </div>

    <script>
        const yesBtn = document.getElementById("yes");
        const noBtn = document.getElementById("no");
        const container = document.getElementById("buttons");
        let yesVisible = true;

        // Evet butonu basılamaz
        yesBtn.addEventListener("click", () => {
            // Hiçbir şey yapma
        });

        // Evet mouse üstüne gelince kaçar
        yesBtn.addEventListener("mouseenter", () => {
            const maxX = container.clientWidth - yesBtn.offsetWidth;
            const maxY = container.clientHeight - yesBtn.offsetHeight;
            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;
            yesBtn.style.left = randomX + "px";
            yesBtn.style.top = randomY + "px";
        });

        // Hayır butonu her saniye büyüsün
        let scale = 1;
        const growInterval = setInterval(() => {
            scale += 0.05; // her saniye büyüme miktarı
            noBtn.style.transform = `scale(${scale})`;

            // Evet butonu kaybolacak boyuta ulaşınca
            if (scale >= 3 && yesVisible) {
                yesBtn.style.display = "none";
                yesVisible = false;
            }
        }, 1000);

        // Hayır basılınca mesaj
        noBtn.addEventListener("click", () => {
            clearInterval(growInterval); // büyüme durur
            document.body.innerHTML = `
                <h1 style="font-size:40px;">Bende öyle tahmin etmiştim 😎</h1>
            `;
        });
    </script>
</body>
</html>
